site_name: 技术文档
site_url: https://tangnewstar.github.io/
repo_url: https://github.com/tangnewstar/tangnewstar.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 数据库:
      - 概览: database/index.md
      - MySQL:
          - 概览: database/mysql/index.md
          - 架构总览: database/mysql/mysql-architecture.md
          - 存储引擎:
              - 概览: database/mysql/storage-engine/index.md
              - InnoDB Overview: database/mysql/storage-engine/innodb-overview.md
              - InnoDB Architecture: database/mysql/storage-engine/innodb-architecture.md
              - In-Memory Structures: database/mysql/storage-engine/innodb-in-memory-structures.md
              - Multi-Versioning: database/mysql/storage-engine/innodb-multi-versioning.md
          - 日志:
              - 概览: database/mysql/logs/index.md
              - MySQL 日志详解: database/mysql/logs/mysql-logs-overview.md
              - Binary Log: database/mysql/logs/binary-log.md
              - Redo Log: database/mysql/logs/redo-log.md
              - Undo Log: database/mysql/logs/undo-log.md
          - Terms:
              - 概览: database/mysql/terms/index.md
              - Checkpoint: database/mysql/terms/checkpoint.md
              - LSN: database/mysql/terms/lsn.md
              - Consistent Read: database/mysql/terms/consistent-read.md
          - 索引:
              - 概览: database/mysql/index-structure/index.md
              - 索引数据结构: database/mysql/index-structure/index-data-structure.md
              - 索引设计原则与失效场景: database/mysql/index-structure/index-design.md
              - mysql index Cardinality: database/mysql/index-structure/index-cardinality.md
              - 番外篇：索引长度计算: database/mysql/index-structure/bonus-index-key-len.md
              - 番外篇：页分裂: database/mysql/index-structure/bonus-page-split.md
          - 事务:
              - 概览: database/mysql/transaction/index.md
              - ACID 实现原理: database/mysql/transaction/acid.md
              - 番外篇：悬挂事务: database/mysql/transaction/bonus-dangling-transaction.md
          - 并发控制:
              - 概览: database/mysql/concurrency/index.md
              - 事务隔离级别: database/mysql/concurrency/transaction-isolation.md
              - 并发事务问题: database/mysql/concurrency/multi-transaction-concurrency.md
              - MVCC & ReadView: database/mysql/concurrency/mvcc-readview.md
              - 锁机制: database/mysql/concurrency/locking.md
              - 示例：RC 只锁修改的行: database/mysql/concurrency/example-rc-locks.md
              - 示例：分析不同的隔离级别: database/mysql/concurrency/example-isolation-levels.md
          - 高可用与集群:
              - 概览: database/mysql/high-availability/index.md
              - MySQL 主从复制: database/mysql/high-availability/master-slave-replication.md
              - MGR、InnoDB Cluster 与自动切换: database/mysql/high-availability/mgr-innodb-cluster.md
